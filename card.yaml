type: markdown
title: Library books
content: >-
  {%- set ns = namespace(loans=[]) -%}
  {%- for sensor in integration_entities('cardiff_library') -%}
  {%- for loan in state_attr(sensor, 'loans') or [] -%}
  {%- set ns.loans = ns.loans + [dict(loan, account=state_attr(sensor, 'account'))] -%}
  {%- endfor -%}
  {%- endfor -%}
  {%- for loan in ns.loans | sort(attribute='due') -%}
  {%- set days = (as_datetime(loan.due).date() - now().date()).days %}
  <table><tr>
  <td width="70">{% if loan.cover %}<img src="{{ loan.cover }}" width="60">{% endif %}</td>
  <td><b>{{ loan.title }}</b><br>{{ loan.account }} · due {{ as_datetime(loan.due).strftime('%a %d %b') }}
  {%- if days < 0 %} · <b>overdue {{ -days }}d</b>{% elif days == 0 %} · <b>due today</b>{% elif days <= 3 %} · <b>due in {{ days }}d</b>{% endif %}</td>
  </tr></table>
  {%- else %}
  No books on loan.
  {%- endfor %}
