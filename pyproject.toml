[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cardiff-library"
version = "0.1.0"
description = "List current loans and due dates for Cardiff Libraries accounts"
requires-python = ">=3.13"
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-recording>=0.13",
  "vcrpy>=7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cardiff_library"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--block-network"
pythonpath = ["tests"]
